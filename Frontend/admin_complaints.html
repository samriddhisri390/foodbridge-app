<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodBridge Admin | Complaints Management</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Translations & Global Functions -->
    <script src="lang.js"></script>

    <style>
        :root {
            --primary: #22c55e;
            --primary-rgb: 34, 197, 94;
            --primary-dark: #16a34a;
            --background: #f8fafc;
            --surface: rgba(255, 255, 255, 0.7);
            --surface-solid: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: rgba(226, 232, 240, 0.8);
            --glass-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.1);
            
            --admin-purple: #8b5cf6;
            --admin-purple-bg: #f5f3ff;
            
            --status-open: #ef4444;
            --status-open-bg: #fee2e2;
            --status-review: #f59e0b;
            --status-review-bg: #fef3c7;
            --status-resolved: #22c55e;
            --status-resolved-bg: #dcfce7;
            
            --priority-high: #ef4444;
            --priority-high-bg: #fee2e2;
            --priority-medium: #f59e0b;
            --priority-medium-bg: #fef3c7;
            --priority-low: #22c55e;
            --priority-low-bg: #dcfce7;

            --issue-food: #f97316;
            --issue-food-bg: rgba(249, 115, 22, 0.1);
            --issue-pickup: #eab308;
            --issue-pickup-bg: rgba(234, 179, 8, 0.1);
            --issue-noshow: #ef4444;
            --issue-noshow-bg: rgba(239, 68, 68, 0.1);
            --issue-fraud: #8b5cf6;
            --issue-fraud-bg: rgba(139, 92, 246, 0.1);
            --issue-other: #64748b;
            --issue-other-bg: rgba(100, 116, 139, 0.1);
        }

        [data-theme="dark"] {
            --background: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-solid: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(51, 65, 85, 0.8);
            --glass-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            
            --admin-purple-bg: rgba(139, 92, 246, 0.2);
            --status-open-bg: rgba(239, 68, 68, 0.2);
            --status-review-bg: rgba(245, 158, 11, 0.2);
            --status-resolved-bg: rgba(34, 197, 94, 0.2);
            
            --priority-high-bg: rgba(239, 68, 68, 0.2);
            --priority-medium-bg: rgba(245, 158, 11, 0.2);
            --priority-low-bg: rgba(34, 197, 94, 0.2);
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }

        * { box-sizing: border-box; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .fade-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
        .scale-up { animation: scaleUp 0.3s ease-out forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; opacity: 0; }
        .slide-down { animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .fade-out { animation: fadeIn 0.3s ease-out reverse forwards; }
        
        /* Layout Structure */
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid var(--border);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 50;
        }
        .sidebar.collapsed { width: 80px; }

        .sidebar-header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            overflow: hidden;
            text-decoration: none;
        }
        .sidebar-header h2 { margin-left: 12px; color: var(--primary); font-size: 20px; margin-top: 0; margin-bottom: 0; }

        .nav-items {
            padding: 24px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            border-radius: 16px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-decoration: none;
        }
        .nav-item:hover { background: rgba(34, 197, 94, 0.1); color: var(--primary); }
        .nav-item.active { background: var(--primary); color: white; }

        .collapse-btn {
            position: absolute;
            right: -14px;
            top: 21px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 100;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Navbar */
        .navbar {
            height: 70px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 40;
        }

        .navbar-left { display: none; align-items: center; gap: 10px; }
        .navbar-left i { color: var(--primary); }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .role-badge {
            background: var(--admin-purple-bg);
            color: var(--admin-purple);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: all 0.2s;
            position: relative;
        }
        .icon-btn:hover { background: rgba(34, 197, 94, 0.1); color: var(--primary); }
        .notification-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 2px solid var(--surface-solid);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px;
            padding-right: 12px;
            border-radius: 99px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .user-profile:hover { background: var(--background); }
        .user-profile img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }

        .main-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* Stats Row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
        }
        .stat-card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--glass-shadow);
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stat-info h3 { margin: 0; font-size: 24px; font-weight: 800; }
        .stat-info p { margin: 4px 0 0 0; color: var(--text-muted); font-size: 14px; font-weight: 500; }

        /* Filter Bar */
        .filter-section {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }
        .search-container {
            flex: 1;
            min-width: 250px;
            display: flex;
            align-items: center;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 16px;
        }
        .search-container input {
            border: none;
            background: transparent;
            outline: none;
            margin-left: 10px;
            color: var(--text-main);
            width: 100%;
            font-family: inherit;
        }
        .filter-select {
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--background);
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            min-width: 150px;
        }

        /* Bulk Actions Bar */
        .bulk-actions-bar {
            position: absolute;
            top: 70px;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 45;
        }
        .bulk-btns { display: flex; gap: 12px; }
        .btn-white { padding: 8px 16px; border-radius: 10px; border: none; background: white; color: var(--primary); font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; }
        .btn-white-outline { padding: 8px 16px; border-radius: 10px; border: 1.5px solid white; background: transparent; color: white; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: inherit; }

        /* Tables */
        .table-section {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 32px;
            box-shadow: var(--shadow-lg);
        }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 16px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 15px; }
        tr:last-child td { border-bottom: none; }
        
        tr.selected { background: rgba(var(--primary-rgb), 0.05); }

        .badge { padding: 6px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
        .status-badge.open { background: var(--status-open-bg); color: var(--status-open); }
        .status-badge.review { background: var(--status-review-bg); color: var(--status-review); }
        .status-badge.resolved { background: var(--status-resolved-bg); color: var(--status-resolved); }
        
        .priority-badge.high { background: var(--priority-high-bg); color: var(--priority-high); }
        .priority-badge.medium { background: var(--priority-medium-bg); color: var(--priority-medium); }
        .priority-badge.low { background: var(--priority-low-bg); color: var(--priority-low); }

        .issue-badge { font-weight: 600; }

        .action-btns { display: flex; gap: 8px; }
        .btn-sm { padding: 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--background); color: var(--text-muted); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-sm:hover { border-color: var(--primary); color: var(--primary); background: rgba(34, 197, 94, 0.05); }

        /* Mobile Cards */
        .mobile-cards { display: none; flex-direction: column; gap: 16px; }
        .complaint-card-mobile {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--surface-solid);
            border-radius: 32px;
            width: 95%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            padding: 32px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-close { background: var(--background); border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .info-card { background: var(--background); padding: 20px; border-radius: 20px; border: 1px solid var(--border); }
        
        .evidence-grid { display: flex; gap: 12px; margin-top: 12px; }
        .evidence-thumb { width: 80px; height: 80px; border-radius: 12px; background: #e2e8f0; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-muted); }

        textarea { width: 100%; border-radius: 12px; border: 1px solid var(--border); background: var(--background); color: var(--text-main); padding: 12px; font-family: inherit; resize: vertical; min-height: 100px; outline: none; }
        textarea:focus { border-color: var(--primary); }

        .btn-primary { padding: 12px 24px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { padding: 12px 24px; border-radius: 12px; border: 1.5px solid var(--border); background: transparent; color: var(--text-main); font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        .status-update-row { display: flex; align-items: center; gap: 16px; background: var(--background); padding: 16px; border-radius: 16px; margin-top: 24px; }

        .modal-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; border-top: 1px solid var(--border); padding-top: 24px; }

        /* Pagination */
        .pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state i { font-size: 64px; color: var(--primary); margin-bottom: 24px; }

        /* Mobile Bottom Nav */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            padding: 12px 0;
            justify-content: space-around;
            z-index: 100;
        }
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            text-decoration: none;
        }
        .bottom-nav-item.active { color: var(--primary); }

        .theme-toggle {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
            border: none;
            z-index: 1000;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar { display: none; }
            .navbar-left { display: flex; }
            .bottom-nav { display: flex; padding-bottom: env(safe-area-inset-bottom, 12px); }
            .app-container { padding-bottom: 70px; }
            .theme-toggle { bottom: 90px; }
            .modal-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .table-section { display: none; }
            .mobile-cards { display: flex; }
            .filter-section { flex-direction: column; align-items: stretch; }
            .search-container { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 24, color, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = "";
                    const i = document.createElement("i");
                    i.setAttribute("data-lucide", name);
                    if (color) i.style.color = color;
                    if (size) { i.style.width = size + "px"; i.style.height = size + "px"; }
                    if (className) i.className = className;
                    iconRef.current.appendChild(i);
                    lucide.createIcons({ root: iconRef.current });
                }
            }, [name, color, size, className]);
            return <span ref={iconRef} className={`icon-wrapper ${className}`} style={{ display: "inline-flex", alignItems: "center", justifyContent: "center" }} />;
        };

        const LanguageSwitcher = () => {
            const [lang, setLang] = useState(window.getLang());
            const toggleLang = (newLang) => {
                window.setLang(newLang);
                setLang(newLang);
                window.location.reload();
            };
            return (
                <div className="lang-switcher" style={{ display: 'flex', gap: '4px', background: 'var(--surface)', padding: '4px', borderRadius: '20px', border: '1px solid var(--border)' }}>
                    <button style={{ padding: '4px 12px', border: 'none', borderRadius: '16px', background: lang === 'english' ? 'var(--primary)' : 'transparent', color: lang === 'english' ? 'white' : 'var(--text-muted)', cursor: 'pointer', fontWeight: 600, fontSize: '0.8rem' }} onClick={() => toggleLang('english')}>🇬🇧 EN</button>
                    <button style={{ padding: '4px 12px', border: 'none', borderRadius: '16px', background: lang === 'hindi' ? 'var(--primary)' : 'transparent', color: lang === 'hindi' ? 'white' : 'var(--text-muted)', cursor: 'pointer', fontWeight: 600, fontSize: '0.8rem' }} onClick={() => toggleLang('hindi')}>🇮🇳 HI</button>
                </div>
            );
        };

        const App = () => {
            const [darkMode, setDarkMode] = useState(false);
            const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [statusFilter, setStatusFilter] = useState('All');
            const [typeFilter, setTypeFilter] = useState('All');
            const [selectedRows, setSelectedRows] = useState([]);
            const [modal, setModal] = useState({ open: false, type: '', data: null });
            
            const [complaints, setComplaints] = useState([
                { id: "#CP-001", by: "Rahul Sharma", byRole: "Donor", against: "Helping Hands NGO", againstRole: "NGO", issue: "Late Pickup", date: "23 Apr 2026", priority: "High", status: "Open", desc: "The NGO volunteer arrived 2 hours late for pickup. Food had already spoiled by then." },
                { id: "#CP-002", by: "Priya Singh", byRole: "Donor", against: "Food For All NGO", againstRole: "NGO", issue: "No Show", date: "22 Apr 2026", priority: "High", status: "Open", desc: "I waited for 3 hours but nobody showed up to collect the surplus food." },
                { id: "#CP-003", by: "Helping Hands NGO", byRole: "NGO", against: "Amit Kumar", againstRole: "Donor", issue: "Food Quality", date: "21 Apr 2026", priority: "Medium", status: "In Review", desc: "The quality of food delivered was not up to the mark. It smelled stale." },
                { id: "#CP-004", by: "Neha Gupta", byRole: "Donor", against: "Care & Share NGO", againstRole: "NGO", issue: "Late Pickup", date: "20 Apr 2026", priority: "Medium", status: "In Review", desc: "Volunteer arrived late. Please ensure timely pickups." },
                { id: "#CP-005", by: "Ravi Verma", byRole: "Donor", against: "Meal Mission NGO", againstRole: "NGO", issue: "Fraud", date: "19 Apr 2026", priority: "High", status: "In Review", desc: "Suspicious activity reported regarding the donation distribution." },
                { id: "#CP-006", by: "Food For All NGO", byRole: "NGO", against: "Suresh Patel", againstRole: "Donor", issue: "Food Quality", date: "18 Apr 2026", priority: "Low", status: "Resolved", desc: "Issue resolved. Donor promised to be more careful with packaging." },
                { id: "#CP-007", by: "Anjali Mehta", byRole: "Donor", against: "Hope Kitchen NGO", againstRole: "NGO", issue: "No Show", date: "17 Apr 2026", priority: "Medium", status: "Resolved", desc: "Followed up with the NGO. It was a communication gap." },
                { id: "#CP-008", by: "Vikram Shah", byRole: "Donor", against: "Helping Hands NGO", againstRole: "NGO", issue: "Other", date: "16 Apr 2026", priority: "Low", status: "Resolved", desc: "Minor disagreement over pickup location." }
            ]);

            useEffect(() => {
                document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
            }, [darkMode]);

            const filteredComplaints = complaints.filter(c => {
                const matchesSearch = c.id.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                     c.by.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                     c.issue.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesStatus = statusFilter === 'All' || c.status === statusFilter;
                const matchesType = typeFilter === 'All' || c.issue === typeFilter;
                return matchesSearch && matchesStatus && matchesType;
            });

            const stats = [
                { label: "Total Complaints", value: complaints.length, icon: "inbox", color: "#64748b", bg: "rgba(100, 116, 139, 0.1)" },
                { label: "Open", value: complaints.filter(c => c.status === 'Open').length, icon: "alert-circle", color: "#ef4444", bg: "rgba(239, 68, 68, 0.1)" },

                                                <option>7 days</option>
                                                <option>30 days</option>
                                                <option>Permanent</option>
                                            </select>
                                        </div>
                                        <textarea placeholder="Reason for suspension (visible to user)..."></textarea>
                                        <div style={{ display: 'flex', gap: '12px', marginTop: '10px' }}>
                                            <button className="btn-outline" style={{ flex: 1 }} onClick={() => setModal({ open: false, type: '', data: null })}>Cancel</button>
                                            <button className="btn-primary" style={{ flex: 1, background: '#ef4444' }}>Yes, Suspend 🚫</button>
                                        </div>
                                    </div>
                                )}

                                {modal.type === 'Dismiss Complaint' && modal.data && (
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                                        <p style={{ margin: 0, fontSize: '16px' }}>Dismiss complaint <b>{modal.data.id}</b>?</p>
                                        <div>
                                            <label style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '8px', display: 'block' }}>Reason for Dismissal</label>
                                            <select className="filter-select" style={{ width: '100%' }}>
                                                <option>Invalid</option>
                                                <option>Duplicate</option>
                                                <option>Resolved Offline</option>
                                                <option>Other</option>
                                            </select>
                                        </div>
                                        <textarea placeholder="Internal notes for dismissal..."></textarea>
                                        <div style={{ display: 'flex', gap: '12px', marginTop: '10px' }}>
                                            <button className="btn-outline" style={{ flex: 1 }} onClick={() => setModal({ open: false, type: '', data: null })}>Cancel</button>
                                            <button className="btn-primary" style={{ flex: 1, background: '#64748b' }} onClick={() => dismissComplaint(modal.data.id)}>Dismiss</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Mobile Bottom Nav */}
                    <div className="bottom-nav">
                        <a href="admin_panel.html" className="bottom-nav-item">
                            <Icon name="layout-dashboard" size={24} />
                            <span>Overview</span>
                        </a>
                        <a href="#" className="bottom-nav-item">
                            <Icon name="users" size={24} />
                            <span>Users</span>
                        </a>
                        <a href="#" className="bottom-nav-item">
                            <Icon name="package" size={24} />
                            <span>Donations</span>
                        </a>
                        <a href="#" className="bottom-nav-item">
                            <Icon name="building" size={24} />
                            <span>NGOs</span>
                        </a>
                        <a href="admin_complaints.html" className="bottom-nav-item active">
                            <Icon name="alert-triangle" size={24} />
                            <span>Complaints</span>
                        </a>
                    </div>

                    <button className="theme-toggle" onClick={() => setDarkMode(!darkMode)}>
                        <Icon name={darkMode ? "sun" : "moon"} size={24} />
                    </button>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
