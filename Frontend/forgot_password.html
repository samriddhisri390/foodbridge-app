<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | FoodBridge</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Translations & Global Functions -->
    <script src="lang.js"></script>
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('login-bg.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            transition: all 0.3s ease;
        }

        .dark-mode body {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('login-bg.png') no-repeat center center fixed;
            background-size: cover;
        }

        .forgot-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 3rem;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(var(--primary-rgb), 0.1);
            position: absolute;
            top: 0;
            left: 0;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(var(--primary-rgb), 0.5);
        }

        .step-info {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            color: var(--text-main);
        }

        .header p {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        /* OTP Inputs */
        .otp-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .otp-input {
            width: 50px;
            height: 60px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--surface);
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            transition: var(--transition);
        }

        .otp-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.1);
            transform: translateY(-2px);
        }

        /* Password Strength */
        .strength-meter {
            height: 4px;
            width: 100%;
            background: var(--border);
            border-radius: 2px;
            margin: 10px 0;
            overflow: hidden;
            display: flex;
        }

        .strength-bar {
            height: 100%;
            transition: all 0.3s ease;
        }

        .strength-text {
            font-size: 0.75rem;
            text-align: left;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .timer {
            color: var(--primary);
            font-weight: 700;
            margin-top: 1rem;
            display: block;
        }

        .resend-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            font-size: 0.875rem;
        }

        .resend-btn:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
            text-decoration: none;
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 3rem;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--surface);
            color: var(--text-main);
            transition: var(--transition);
            font-family: 'Outfit';
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: rgba(var(--primary-rgb), 0.1);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .theme-toggle {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            border: none;
            z-index: 1000;
            transition: var(--transition);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            margin-top: 2rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--primary);
        }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.style.width = size + 'px';
                    i.style.height = size + 'px';
                    iconRef.current.appendChild(i);
                    lucide.createIcons({ root: iconRef.current });
                }
            }, [name, size]);
            return <span ref={iconRef} className={className} style={{ display: 'inline-flex' }}></span>;
        };

        const LanguageSwitcher = () => {
            const [lang, setLang] = useState(window.getLang());
            const toggleLang = (newLang) => {
                window.setLang(newLang);
                setLang(newLang);
                window.location.reload();
            };
            return (
                <div className="lang-switcher" style={{ position: 'fixed', top: '2rem', right: '2rem', zIndex: 1000, background: 'var(--surface)', boxShadow: 'var(--shadow-md)' }}>
                    <button className={lang === 'english' ? 'active' : ''} onClick={() => toggleLang('english')}>🇬🇧 EN</button>
                    <button className={lang === 'hindi' ? 'active' : ''} onClick={() => toggleLang('hindi')}>🇮🇳 HI</button>
                </div>
            );
        };

        const App = () => {
            const [step, setStep] = useState(1);
            const [email, setEmail] = useState('');
            const [otp, setOtp] = useState(['', '', '', '', '', '']);
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [timer, setTimer] = useState(60);
            const [darkMode, setDarkMode] = useState(false);
            const [loading, setLoading] = useState(false);
            const otpRefs = [useRef(), useRef(), useRef(), useRef(), useRef(), useRef()];

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark-mode');
                } else {
                    document.documentElement.classList.remove('dark-mode');
                }
            }, [darkMode]);

            useEffect(() => {
                let interval;
                if (step === 2 && timer > 0) {
                    interval = setInterval(() => setTimer(prev => prev - 1), 1000);
                }
                return () => clearInterval(interval);
            }, [step, timer]);

            useEffect(() => {
                if (step === 4) {
                    const timeout = setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                    return () => clearTimeout(timeout);
                }
            }, [step]);

            const handleOtpChange = (index, value) => {
                if (isNaN(value)) return;
                const newOtp = [...otp];
                newOtp[index] = value.substring(value.length - 1);
                setOtp(newOtp);
                
                if (value && index < 5) {
                    otpRefs[index + 1].current.focus();
                }
            };

            const handleOtpKeyDown = (index, e) => {
                if (e.key === 'Backspace' && !otp[index] && index > 0) {
                    otpRefs[index - 1].current.focus();
                }
            };

            const getPasswordStrength = () => {
                if (!password) return { label: '', color: '#e2e8f0', width: '0%' };
                if (password.length < 6) return { label: 'Weak', color: '#ef4444', width: '33%' };
                if (password.length < 10) return { label: 'Good', color: '#f59e0b', width: '66%' };
                return { label: 'Strong', color: '#10b981', width: '100%' };
            };

            const strength = getPasswordStrength();

            const nextStep = (e) => {
                e.preventDefault();
                setLoading(true);
                setTimeout(() => {
                    setLoading(false);
                    setStep(prev => prev + 1);
                }, 800);
            };

            const resendOtp = () => {
                setTimer(60);
                // Logic to resend OTP
            };

            const progressWidth = ((step - 1) / 3) * 100;

            return (
                <>
                <LanguageSwitcher />
                <div className="forgot-card">
                    <div className="progress-container">
                        <div className="progress-bar" style={{ width: `${progressWidth}%` }}></div>
                    </div>

                    {step < 4 && (
                        <div className="step-info">Step {step} of 3</div>
                    )}

                    {step === 1 && (
                        <div className="animate-fade">
                            <div className="header">
                                <h1>{window.t('forgot_title')}</h1>
                                <p>No worries! Enter your email and we'll send you an OTP to reset your password.</p>
                            </div>
                            <form onSubmit={nextStep}>
                                <div className="form-group">
                                    <label>{window.t('forgot_email_step')}</label>
                                    <div className="input-wrapper">
                                        <Icon name="mail" className="icon" />
                                        <input 
                                            type="email" 
                                            className="form-control" 
                                            placeholder="your@email.com" 
                                            required
                                            value={email}
                                            onChange={(e) => setEmail(e.target.value)}
                                        />
                                    </div>
                                </div>
                                <button type="submit" className="btn btn-primary" disabled={loading}>
                                    {loading ? window.t('common_loading') : window.t('forgot_send_otp')}
                                    {!loading && <Icon name="arrow-right" />}
                                </button>
                            </form>
                        </div>
                    )}

                    {step === 2 && (
                        <div className="animate-fade">
                            <div className="header">
                                <h1>{window.t('forgot_verify')}</h1>
                                <p>We've sent a 6-digit code to <strong>{email}</strong>. Enter it below to continue.</p>
                            </div>
                            <form onSubmit={nextStep}>
                                <div className="otp-container">
                                    {otp.map((digit, index) => (
                                        <input
                                            key={index}
                                            ref={otpRefs[index]}
                                            type="text"
                                            className="otp-input"
                                            maxLength="1"
                                            value={digit}
                                            onChange={(e) => handleOtpChange(index, e.target.value)}
                                            onKeyDown={(e) => handleOtpKeyDown(index, e)}
                                            required
                                        />
                                    ))}
                                </div>
                                <button type="submit" className="btn btn-primary" disabled={loading}>
                                    {loading ? window.t('common_loading') : window.t('forgot_verify')}
                                    {!loading && <Icon name="shield-check" />}
                                </button>
                                
                                <div className="timer-section">
                                    {timer > 0 ? (
                                        <span className="timer">Resend code in {timer}s</span>
                                    ) : (
                                        <div style={{ marginTop: '1rem' }}>
                                            <p style={{ fontSize: '0.875rem', color: 'var(--text-muted)' }}>Didn't receive the code?</p>
                                            <button type="button" onClick={resendOtp} className="resend-btn">{window.t('forgot_resend')}</button>
                                        </div>
                                    )}
                                </div>
                            </form>
                        </div>
                    )}

                    {step === 3 && (
                        <div className="animate-fade">
                            <div className="header">
                                <h1>{window.t('forgot_pass_step')}</h1>
                                <p>Please enter a strong password that you haven't used before.</p>
                            </div>
                            <form onSubmit={nextStep}>
                                <div className="form-group">
                                    <label>{window.t('signup_password')}</label>
                                    <div className="input-wrapper">
                                        <Icon name="lock" className="icon" />
                                        <input 
                                            type="password" 
                                            className="form-control" 
                                            placeholder="••••••••" 
                                            required
                                            value={password}
                                            onChange={(e) => setPassword(e.target.value)}
                                        />
                                    </div>
                                </div>

                                <div className="strength-meter">
                                    <div className="strength-bar" style={{ width: strength.width, backgroundColor: strength.color }}></div>
                                </div>
                                <div className="strength-text" style={{ color: strength.color }}>
                                    {strength.label && `Strength: ${strength.label}`}
                                </div>

                                <div className="form-group">
                                    <label>{window.t('signup_confirm')}</label>
                                    <div className="input-wrapper">
                                        <Icon name="check-circle" className="icon" />
                                        <input 
                                            type="password" 
                                            className="form-control" 
                                            placeholder="••••••••" 
                                            required
                                            value={confirmPassword}
                                            onChange={(e) => setConfirmPassword(e.target.value)}
                                        />
                                    </div>
                                </div>

                                <button type="submit" className="btn btn-primary" disabled={loading || password !== confirmPassword}>
                                    {loading ? window.t('common_loading') : window.t('forgot_reset')}
                                    {!loading && <Icon name="refresh-cw" />}
                                </button>
                                {password !== confirmPassword && confirmPassword && (
                                    <p style={{ color: '#ef4444', fontSize: '0.75rem', marginTop: '0.5rem', fontWeight: 600 }}>Passwords do not match!</p>
                                )}
                            </form>
                        </div>
                    )}

                    {step === 4 && (
                        <div className="animate-fade">
                            <div className="success-icon">
                                <Icon name="check" size={48} />
                            </div>
                            <div className="header">
                                <h1>{window.t('forgot_success')}</h1>
                                <p>Your password has been successfully reset. You can now log in with your new credentials.</p>
                            </div>
                            <button onClick={() => window.location.href = 'login.html'} className="btn btn-primary">
                                {window.t('login_back_home')}
                                <Icon name="log-in" />
                            </button>
                        </div>
                    )}

                    {step < 4 && (
                        <a href="login.html" className="back-link">
                            <Icon name="arrow-left" size={16} />
                            {window.t('common_back')}
                        </a>
                    )}

                    <button className="theme-toggle" onClick={() => setDarkMode(!darkMode)} title="Toggle Dark Mode">
                        <Icon name={darkMode ? "sun" : "moon"} />
                    </button>
                </div>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
