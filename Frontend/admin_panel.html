<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodBridge | Admin Panel</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Translations & Global Functions -->
    <script src="lang.js"></script>

    <style>
        :root {
            --primary: #22c55e;
            --primary-rgb: 34, 197, 94;
            --primary-dark: #16a34a;
            --background: #f8fafc;
            --surface: rgba(255, 255, 255, 0.7);
            --surface-solid: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: rgba(226, 232, 240, 0.8);
            --glass-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.1);
            
            --admin-purple: #8b5cf6;
            --admin-purple-bg: #f5f3ff;
            
            --status-active: #22c55e;
            --status-active-bg: #dcfce7;
            --status-suspended: #ef4444;
            --status-suspended-bg: #fee2e2;
            --status-pending: #f59e0b;
            --status-pending-bg: #fef3c7;
        }

        [data-theme="dark"] {
            --background: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-solid: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(51, 65, 85, 0.8);
            --glass-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            
            --admin-purple-bg: rgba(139, 92, 246, 0.2);
            --status-active-bg: rgba(34, 197, 94, 0.2);
            --status-suspended-bg: rgba(239, 68, 68, 0.2);
            --status-pending-bg: rgba(245, 158, 11, 0.2);
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }

        * { box-sizing: border-box; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes barGrow { from { height: 0; } to { height: 100%; } }
        @keyframes widthGrow { from { width: 0; } to { width: 100%; } }
        
        .fade-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
        .scale-up { animation: scaleUp 0.3s ease-out forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; opacity: 0; }
        .bar-anim { animation: barGrow 1s ease-out forwards; transform-origin: bottom; }
        
        /* Layout Structure */
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid var(--border);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 50;
        }
        .sidebar.collapsed { width: 80px; }

        .sidebar-header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            overflow: hidden;
        }
        .sidebar-header h2 { margin-left: 12px; color: var(--primary); font-size: 20px; margin-top: 0; margin-bottom: 0; }

        .nav-items {
            padding: 24px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            border-radius: 16px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-decoration: none;
        }
        .nav-item:hover { background: rgba(34, 197, 94, 0.1); color: var(--primary); }
        .nav-item.active { background: var(--primary); color: white; }
        .nav-item.active:hover { background: var(--primary-dark); }

        .collapse-btn {
            position: absolute;
            right: -14px;
            top: 21px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            z-index: 100;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Navbar */
        .navbar {
            height: 70px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 40;
        }

        .navbar-left { display: none; align-items: center; gap: 10px; }
        .navbar-left i { color: var(--primary); }

        .search-container {
            display: flex;
            align-items: center;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 8px 16px;
            width: 350px;
            transition: all 0.2s;
        }
        .search-container:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1); }
        .search-container input {
            border: none;
            background: transparent;
            outline: none;
            margin-left: 10px;
            color: var(--text-main);
            width: 100%;
            font-family: inherit;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .role-badge {
            background: var(--admin-purple-bg);
            color: var(--admin-purple);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: all 0.2s;
            position: relative;
        }
        .icon-btn:hover { background: rgba(34, 197, 94, 0.1); color: var(--primary); }
        .notification-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #ef4444;
            color: white;
            font-size: 10px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 2px solid var(--surface-solid);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px;
            padding-right: 12px;
            border-radius: 99px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .user-profile:hover { background: var(--background); }
        .user-profile img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }

        .main-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* Stats Row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
        }
        .stat-card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            box-shadow: var(--glass-shadow);
            transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stat-info h3 { margin: 0; font-size: 24px; font-weight: 800; }
        .stat-info p { margin: 4px 0 0 0; color: var(--text-muted); font-size: 14px; font-weight: 500; }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
        }
        .chart-card {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .chart-header h4 { margin: 0; font-size: 18px; font-weight: 700; }

        /* Pure CSS Bar Chart */
        .bar-chart-container {
            height: 200px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding-top: 20px;
            gap: 10px;
        }
        .bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            height: 100%;
            justify-content: flex-end;
        }
        .bar-rail {
            width: 30px;
            height: 100%;
            background: var(--background);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }
        .bar-fill {
            width: 100%;
            background: var(--primary);
            border-radius: 8px;
            transition: all 0.3s;
            position: relative;
        }
        .bar-fill:hover { background: var(--primary-dark); }
        .bar-tooltip {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text-main);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            white-space: nowrap;
        }
        .bar-fill:hover .bar-tooltip { opacity: 1; top: -35px; }
        .bar-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }

        /* Pure CSS Donut Chart */
        .donut-chart-container {
            height: 200px;
            display: flex;
            align-items: center;
            gap: 40px;
        }
        .donut-visual {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(
                var(--primary) 0% 40%,
                #3b82f6 40% 65%,
                #f97316 65% 85%,
                #eab308 85% 95%,
                #94a3b8 95% 100%
            );
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .donut-visual::before {
            content: '';
            width: 90px;
            height: 90px;
            background: var(--surface-solid);
            border-radius: 50%;
        }
        .chart-legend {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
        .legend-color { width: 12px; height: 12px; border-radius: 3px; }

        /* Horizontal Bar Chart */
        .h-chart-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .h-bar-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .h-bar-label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; }
        .h-bar-rail { height: 12px; background: var(--background); border-radius: 99px; overflow: hidden; }
        .h-bar-fill { height: 100%; background: var(--primary); border-radius: 99px; animation: widthGrow 1s ease-out; }

        /* Area/Line Chart Mock */
        .area-chart {
            height: 200px;
            width: 100%;
            background: linear-gradient(to bottom, rgba(34, 197, 94, 0.2), transparent);
            border-bottom: 2px solid var(--primary);
            position: relative;
            clip-path: polygon(0% 100%, 0% 60%, 20% 40%, 40% 70%, 60% 30%, 80% 50%, 100% 20%, 100% 100%);
        }

        /* Tables */
        .table-section {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 32px;
            box-shadow: var(--shadow-lg);
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .table-actions { display: flex; gap: 12px; }
        .filter-select {
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--background);
            color: var(--text-main);
            font-family: inherit;
            outline: none;
        }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 16px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: color 0.2s; }
        th:hover { color: var(--primary); }
        td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 15px; }
        tr:last-child td { border-bottom: none; }
        
        .avatar-circle { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; }
        .status-badge { padding: 6px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
        
        .action-btns { display: flex; gap: 8px; }
        .btn-sm { padding: 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--background); color: var(--text-muted); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-sm:hover { border-color: var(--primary); color: var(--primary); background: rgba(34, 197, 94, 0.05); }
        .btn-sm.delete:hover { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.05); }

        .pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
        .page-info { color: var(--text-muted); font-size: 14px; }
        .page-btns { display: flex; gap: 8px; }

        /* Complaints Section */
        .complaints-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
        .complaint-card {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .complaint-header { display: flex; justify-content: space-between; align-items: center; }
        .complaint-footer { display: flex; gap: 12px; margin-top: 8px; }
        .btn-outline { flex: 1; padding: 10px; border-radius: 12px; border: 1.5px solid var(--border); background: transparent; color: var(--text-main); font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .btn-primary { flex: 1; padding: 10px; border-radius: 12px; border: none; background: var(--primary); color: white; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .btn-primary:hover { background: var(--primary-dark); }

        /* Quick Actions Panel */
        .quick-actions-panel {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }
        .actions-btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .big-action-btn {
            background: var(--surface-solid);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            color: var(--text-main);
            font-weight: 700;
        }
        .big-action-btn:hover { border-color: var(--primary); background: rgba(34, 197, 94, 0.05); transform: scale(1.02); }
        .big-action-btn i { color: var(--primary); }

        .health-card {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .health-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--border); }
        .health-item:last-child { border-bottom: none; }
        .health-status { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--surface-solid);
            border-radius: 32px;
            width: 90%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            padding: 32px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-close { background: var(--background); border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .modal-close:hover { background: #fee2e2; color: #ef4444; }

        /* Mobile Bottom Nav */
        .bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            padding: 12px 0;
            justify-content: space-around;
            z-index: 100;
        }
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            text-decoration: none;
        }
        .bottom-nav-item.active { color: var(--primary); }

        .theme-toggle {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
            border: none;
            z-index: 1000;
            transition: transform 0.3s;
        }
        .theme-toggle:hover { transform: scale(1.1) rotate(15deg); }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar { display: none; }
            .navbar-left { display: flex; }
            .bottom-nav { display: flex; padding-bottom: env(safe-area-inset-bottom, 12px); }
            .app-container { padding-bottom: 70px; }
            .search-container { width: 250px; }
            .quick-actions-panel { grid-template-columns: 1fr; }
            .theme-toggle { bottom: 90px; }
        }

        @media (max-width: 768px) {
            .search-container { display: none; }
            .main-scroll { padding: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .charts-grid { grid-template-columns: 1fr; }
            .donut-chart-container { flex-direction: column; height: auto; align-items: center; }
            .table-section { padding: 16px; overflow-x: auto; }
            table { min-width: 600px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 24, color, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = "";
                    const i = document.createElement("i");
                    i.setAttribute("data-lucide", name);
                    if (color) i.style.color = color;
                    if (size) { i.style.width = size + "px"; i.style.height = size + "px"; }
                    if (className) i.className = className;
                    iconRef.current.appendChild(i);
                    lucide.createIcons({ root: iconRef.current });
                }
            }, [name, color, size, className]);
            return <span ref={iconRef} className={`icon-wrapper ${className}`} style={{ display: "inline-flex", alignItems: "center", justifyContent: "center" }} />;
        };

        const AnimatedCounter = ({ value, duration = 1000 }) => {
            const [count, setCount] = useState(0);
            useEffect(() => {
                let start = 0;
                const end = parseInt(value.toString().replace(/,/g, ""));
                const increment = end / (duration / 16);
                const timer = setInterval(() => {
                    start += increment;
                    if (start >= end) {
                        setCount(end);
                        clearInterval(timer);
                    } else {
                        setCount(Math.ceil(start));
                    }
                }, 16);
                return () => clearInterval(timer);
            }, [value]);
            return <span>{count.toLocaleString()}</span>;
        };

        const LanguageSwitcher = () => {
            const [lang, setLang] = useState(window.getLang());
            const toggleLang = (newLang) => {
                window.setLang(newLang);
                setLang(newLang);
                window.location.reload();
            };
            return (
                <div className="lang-switcher" style={{ display: 'flex', gap: '4px', background: 'var(--surface)', padding: '4px', borderRadius: '20px', border: '1px solid var(--border)' }}>
                    <button style={{ padding: '4px 12px', border: 'none', borderRadius: '16px', background: lang === 'english' ? 'var(--primary)' : 'transparent', color: lang === 'english' ? 'white' : 'var(--text-muted)', cursor: 'pointer', fontWeight: 600, fontSize: '0.8rem' }} onClick={() => toggleLang('english')}>🇬🇧 EN</button>

                            <div className="table-section slide-up" style={{ animationDelay: '0.5s' }}>
                                <div className="table-header">
                                    <h3 style={{ fontSize: '20px', fontWeight: 800, margin: 0 }}>NGO Management</h3>
                                </div>
                                <div style={{ overflowX: 'auto' }}>
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>NGO Name</th>
                                                <th>City</th>
                                                <th>Verification</th>
                                                <th>Donations</th>
                                                <th>Active Since</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {ngos.map((ngo, i) => (
                                                <tr key={i} className="fade-in-row" style={{ animationDelay: `${i * 0.05}s` }}>
                                                    <td>
                                                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                                            <div className="avatar-circle" style={{ background: '#3b82f6' }}>
                                                                {ngo.name.split(' ').map(n => n[0]).join('')}
                                                            </div>
                                                            <div style={{ fontWeight: 700 }}>{ngo.name}</div>
                                                        </div>
                                                    </td>
                                                    <td>{ngo.city}</td>
                                                    <td>
                                                        <span className="status-badge" style={{ background: getStatusBg(ngo.status), color: getStatusColor(ngo.status) }}>
                                                            {ngo.status} {ngo.status === 'Verified' ? '✓' : '⏳'}
                                                        </span>
                                                    </td>
                                                    <td style={{ fontWeight: 700 }}>{ngo.donations}</td>
                                                    <td>{ngo.since}</td>
                                                    <td>
                                                        <div className="action-btns">
                                                            {ngo.status === 'Pending' && <button className="btn-sm" title="Verify" style={{ borderColor: 'var(--primary)', color: 'var(--primary)' }}><Icon name="check" size={16} /></button>}
                                                            <button className="btn-sm" title="View"><Icon name="eye" size={16} /></button>
                                                            <button className="btn-sm delete" title="Suspend"><Icon name="ban" size={16} /></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* Recent Complaints */}
                            <div className="slide-up" style={{ animationDelay: '0.6s' }}>
                                <h3 style={{ fontSize: '24px', fontWeight: 800, marginBottom: '24px' }}>Recent Complaints ⚠️</h3>
                                <div className="complaints-grid">
                                    {complaints.map((c, i) => (
                                        <div key={i} className="complaint-card">
                                            <div className="complaint-header">
                                                <span style={{ fontWeight: 800, color: 'var(--primary)' }}>{c.id}</span>
                                                <span className="status-badge" style={{ background: getStatusBg(c.status), color: getStatusColor(c.status) }}>{c.status}</span>
                                            </div>
                                            <div>
                                                <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '4px' }}>Reported by {c.by}</div>
                                                <div style={{ fontWeight: 700, fontSize: '16px' }}>Against: {c.against}</div>
                                            </div>
                                            <div style={{ display: 'flex', gap: '10px' }}>
                                                <span className="status-badge" style={{ background: 'var(--background)', color: 'var(--text-main)', border: '1px solid var(--border)' }}>{c.type}</span>
                                                <span style={{ fontSize: '13px', color: 'var(--text-muted)', display: 'flex', alignItems: 'center' }}>{c.date}</span>
                                            </div>
                                            <div className="complaint-footer">
                                                <button className="btn-outline">View Details</button>
                                                {c.status === 'Open' && <button className="btn-primary">Resolve</button>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Quick Actions Panel */}
                            <div className="quick-actions-panel slide-up" style={{ animationDelay: '0.7s', marginBottom: '40px' }}>
                                <div>
                                    <h3 style={{ fontSize: '20px', fontWeight: 800, marginBottom: '16px' }}>System Quick Actions</h3>
                                    <div className="actions-btn-grid">
                                        <button className="big-action-btn" onClick={() => setModal({ open: true, type: 'Send Announcement', data: null })}>
                                            <Icon name="megaphone" size={32} />
                                            Send Announcement
                                        </button>
                                        <button className="big-action-btn">
                                            <Icon name="file-text" size={32} />
                                            Export Data CSV
                                        </button>
                                        <button className="big-action-btn">
                                            <Icon name="user-plus" size={32} />
                                            Add New Admin
                                        </button>
                                        <button className="big-action-btn" onClick={() => window.location.reload()}>
                                            <Icon name="refresh-cw" size={32} />
                                            Refresh System
                                        </button>
                                    </div>
                                </div>
                                <div className="health-card">
                                    <h3 style={{ fontSize: '20px', fontWeight: 800, margin: 0 }}>System Health</h3>
                                    <div className="health-item">
                                        <span>Server</span>
                                        <div className="health-status">🟢 Online</div>
                                    </div>
                                    <div className="health-item">
                                        <span>Database</span>
                                        <div className="health-status">🟢 Connected</div>
                                    </div>
                                    <div className="health-item">
                                        <span>Storage</span>
                                        <div className="health-status">🟢 Normal</div>
                                    </div>
                                    <div className="health-item">
                                        <span>API Gateway</span>
                                        <div className="health-status">🟢 Running</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Modals */}
                    {modal.open && (
                        <div className="modal-overlay" onClick={handleModalClose}>
                            <div className="modal-content scale-up">
                                <div className="modal-header">
                                    <h2 style={{ margin: 0, fontWeight: 800 }}>{modal.type}</h2>
                                    <button className="modal-close" onClick={() => setModal({ open: false, type: '', data: null })}>
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>
                                
                                {modal.type === 'User Details' && modal.data && (
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '20px' }}>
                                            <div className="avatar-circle" style={{ width: '80px', height: '80px', fontSize: '32px', background: getRoleColor(modal.data.role) }}>
                                                {modal.data.name.split(' ').map(n => n[0]).join('')}
                                            </div>
                                            <div>
                                                <h3 style={{ margin: '0 0 4px 0', fontSize: '24px' }}>{modal.data.name}</h3>
                                                <div style={{ color: 'var(--text-muted)' }}>{modal.data.email}</div>
                                                <div style={{ marginTop: '8px' }}>
                                                    <span className="role-badge" style={{ background: getRoleColor(modal.data.role) + '20', color: getRoleColor(modal.data.role) }}>{modal.data.role}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', background: 'var(--background)', padding: '20px', borderRadius: '20px' }}>
                                            <div>
                                                <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '4px' }}>Account Status</div>
                                                <div style={{ fontWeight: 700, color: getStatusColor(modal.data.status) }}>{modal.data.status}</div>
                                            </div>
                                            <div>
                                                <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginBottom: '4px' }}>Member Since</div>
                                                <div style={{ fontWeight: 700 }}>{modal.data.joinDate}</div>
                                            </div>
                                        </div>
                                        <div>
                                            <h4 style={{ marginBottom: '12px' }}>Recent Activity</h4>
                                            <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                                                {[1, 2, 3].map(i => (
                                                    <div key={i} style={{ padding: '12px', border: '1px solid var(--border)', borderRadius: '12px', display: 'flex', justifyContent: 'space-between' }}>
                                                        <span style={{ fontWeight: 600 }}>Donated 5kg Cooked Food</span>
                                                        <span style={{ color: 'var(--text-muted)', fontSize: '12px' }}>2 days ago</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                        <button className="btn-primary" style={{ width: '100%', marginTop: '10px' }} onClick={() => setModal({ open: false, type: '', data: null })}>Close Profile</button>
                                    </div>
                                )}

                                {modal.type === 'Donation Details' && modal.data && (
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                                            <div>
                                                <h3 style={{ margin: '0 0 4px 0', fontSize: '24px' }}>{modal.data.item}</h3>
                                                <div style={{ color: 'var(--primary)', fontWeight: 800 }}>{modal.data.id}</div>
                                            </div>
                                            <span className="status-badge" style={{ background: getStatusBg(modal.data.status), color: getStatusColor(modal.data.status), fontSize: '14px', padding: '8px 16px' }}>{modal.data.status}</span>
                                        </div>
                                        <div style={{ background: 'var(--background)', padding: '20px', borderRadius: '20px', display: 'flex', flexDirection: 'column', gap: '16px' }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                                <span style={{ color: 'var(--text-muted)' }}>Donor</span>
                                                <span style={{ fontWeight: 700 }}>{modal.data.donor}</span>
                                            </div>
                                            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                                <span style={{ color: 'var(--text-muted)' }}>Assigned NGO</span>
                                                <span style={{ fontWeight: 700 }}>{modal.data.ngo}</span>
                                            </div>
                                            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                                <span style={{ color: 'var(--text-muted)' }}>Quantity</span>
                                                <span style={{ fontWeight: 700 }}>{modal.data.qty}</span>
                                            </div>
                                            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                                <span style={{ color: 'var(--text-muted)' }}>Date Posted</span>
                                                <span style={{ fontWeight: 700 }}>{modal.data.date}</span>
                                            </div>
                                        </div>
                                        <div>
                                            <h4 style={{ marginBottom: '16px' }}>Tracking Timeline</h4>
                                            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px', position: 'relative', paddingLeft: '24px' }}>
                                                <div style={{ position: 'absolute', left: '7px', top: '10px', bottom: '10px', width: '2px', background: 'var(--border)' }}></div>
                                                <div style={{ position: 'relative' }}>
                                                    <div style={{ position: 'absolute', left: '-21px', top: '4px', width: '10px', height: '10px', borderRadius: '50%', background: 'var(--primary)' }}></div>
                                                    <div style={{ fontWeight: 700 }}>Donation Posted</div>
                                                    <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Today, 10:00 AM</div>
                                                </div>
                                                <div style={{ position: 'relative' }}>
                                                    <div style={{ position: 'absolute', left: '-21px', top: '4px', width: '10px', height: '10px', borderRadius: '50%', background: modal.data.status === 'Pending' ? 'var(--border)' : 'var(--primary)' }}></div>
                                                    <div style={{ fontWeight: 700 }}>NGO Assigned</div>
                                                    <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Today, 10:45 AM</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {modal.type === 'Suspend Confirmation' && modal.data && (
                                    <div style={{ textAlign: 'center' }}>
                                        <div style={{ width: '80px', height: '80px', borderRadius: '50%', background: '#fee2e2', color: '#ef4444', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 24px auto' }}>
                                            <Icon name="alert-triangle" size={40} />
                                        </div>
                                        <h3 style={{ fontSize: '24px', margin: '0 0 12px 0' }}>Are you sure?</h3>
                                        <p style={{ color: 'var(--text-muted)', marginBottom: '32px' }}>
                                            You are about to suspend <b>{modal.data.name}</b>. They will no longer be able to access their FoodBridge account.
                                        </p>
                                        <div style={{ display: 'flex', gap: '16px' }}>
                                            <button className="btn-outline" style={{ flex: 1 }} onClick={() => setModal({ open: false, type: '', data: null })}>Cancel</button>
                                            <button className="btn-primary" style={{ flex: 1, background: '#ef4444' }}>Yes, Suspend User</button>
                                        </div>
                                    </div>
                                )}

                                {modal.type === 'Send Announcement' && (
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                                        <div>
                                            <label style={{ display: 'block', fontWeight: 700, marginBottom: '8px', fontSize: '14px' }}>Announcement Title</label>
                                            <input type="text" className="filter-select" style={{ width: '100%', background: 'var(--background)' }} placeholder="Important update for all members..." />
                                        </div>
                                        <div>
                                            <label style={{ display: 'block', fontWeight: 700, marginBottom: '8px', fontSize: '14px' }}>Target Audience</label>
                                            <select className="filter-select" style={{ width: '100%', background: 'var(--background)' }}>
                                                <option>All Members</option>
                                                <option>Donors Only</option>
                                                <option>NGO Partners Only</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label style={{ display: 'block', fontWeight: 700, marginBottom: '8px', fontSize: '14px' }}>Message Content</label>
                                            <textarea className="filter-select" style={{ width: '100%', background: 'var(--background)', minHeight: '120px', resize: 'vertical' }} placeholder="Write your message here..."></textarea>
                                        </div>
                                        <div style={{ display: 'flex', gap: '16px', marginTop: '10px' }}>
                                            <button className="btn-outline" style={{ flex: 1 }} onClick={() => setModal({ open: false, type: '', data: null })}>Discard</button>
                                            <button className="btn-primary" style={{ flex: 1 }}>
                                                <Icon name="send" size={18} style={{ marginRight: '8px' }} /> Send Announcement
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Bottom Nav Mobile */}
                    <div className="bottom-nav">
                        {navItems.slice(0, 5).map(item => (
                            <a 
                                key={item.name} 
                                href={item.href} 
                                className={`bottom-nav-item ${activeTab === item.name ? 'active' : ''}`}
                                onClick={(e) => { 
                                    if (item.href === 'admin_panel.html') {
                                        e.preventDefault();
                                        setActiveTab(item.name);
                                    }
                                }}
                            >
                                <Icon name={item.icon} size={24} />
                                <span>{item.name}</span>
                            </a>
                        ))}
                    </div>

                    {/* Dark Mode Toggle */}
                    <button className="theme-toggle" onClick={() => setDarkMode(!darkMode)} title="Toggle Dark/Light Mode">
                        <Icon name={darkMode ? "sun" : "moon"} size={24} />
                    </button>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
