<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodBridge | React Powered Food Donation</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Translations & Global Functions -->
    <script src="lang.js"></script>

    <!-- Pre-existing Styles -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Additional React-specific styles */

        .theme-toggle {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            border: none;
            z-index: 1000;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Custom Hook for Scroll Animations ---
        const useReveal = () => {
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('active');
                        }
                    });
                }, { threshold: 0.1 });

                document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);
        };

        // --- Components ---


        const LanguageSwitcher = () => {
            const [lang, setLang] = useState(window.getLang());

            const toggleLang = (newLang) => {
                window.setLang(newLang);
                setLang(newLang);
                window.location.reload();
            };

            return (
                <div className="lang-switcher">
                    <button className={lang === 'english' ? 'active' : ''} onClick={() => toggleLang('english')}>
                        🇬🇧 EN
                    </button>
                    <button className={lang === 'hindi' ? 'active' : ''} onClick={() => toggleLang('hindi')}>
                        🇮🇳 HI
                    </button>
                </div>
            );
        };

        const Navbar = ({ scrolled }) => {
            const [menuOpen, setMenuOpen] = useState(false);

            useEffect(() => {
                if (menuOpen) {
                    document.body.classList.add('menu-open');
                } else {
                    document.body.classList.remove('menu-open');
                }
            }, [menuOpen]);

            return (
                <nav id="navbar" className={scrolled ? 'scrolled' : ''}>
                    <div className="container">
                        <a href="react-version.html" className="logo">
                            <i data-lucide="heart" style={{ color: 'var(--primary)' }}></i>
                            FoodBridge
                        </a>
                        <div className="nav-links">
                            <a href="#features">{window.t('nav_features')}</a>
                            <a href="#how-it-works">{window.t('nav_how_it_works')}</a>
                            <a href="#impact">{window.t('nav_impact')}</a>
                            <LanguageSwitcher />
                            <a href="login.html" className="btn btn-outline">{window.t('nav_login')}</a>
                            <a href="signup.html" className="btn btn-primary">{window.t('nav_signup')}</a>
                        </div>
                        <div style={{ display: 'flex', gap: '1rem', alignItems: 'center' }} className="show-mobile">
                            <LanguageSwitcher />
                            <button className={`mobile-menu-btn ${menuOpen ? 'open' : ''}`} onClick={() => setMenuOpen(!menuOpen)}>
                                <span></span><span></span><span></span>
                            </button>
                        </div>
                    </div>
                    
                    <div className={`mobile-menu-overlay ${menuOpen ? 'open' : ''}`}>
                        <a href="#features" onClick={() => setMenuOpen(false)}>{window.t('nav_features')}</a>
                        <a href="#how-it-works" onClick={() => setMenuOpen(false)}>{window.t('nav_how_it_works')}</a>
                        <a href="#impact" onClick={() => setMenuOpen(false)}>{window.t('nav_impact')}</a>
                        <a href="login.html" onClick={() => setMenuOpen(false)}>{window.t('nav_login')}</a>
                        <a href="signup.html" className="btn btn-primary" onClick={() => setMenuOpen(false)}>{window.t('nav_signup')}</a>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <header className="hero">
                <div className="container">
                    <div className="hero-content">
                        <h1 className="reveal">{window.t('hero_title')}</h1>
                        <p className="reveal">{window.t('hero_subtitle')}</p>
                        <div className="hero-btns reveal">
                            <a href="login.html" className="btn btn-primary">
                                <i data-lucide="utensils"></i>
                                {window.t('hero_btn_donate')}
                            </a>
                            <a href="login.html" className="btn btn-outline" style={{ borderColor: 'white', color: 'white' }}>
                                <i data-lucide="search"></i>
                                {window.t('hero_btn_find')}
                            </a>
                        </div>
                    </div>
                </div>
            </header>
        );


        const FeatureCard = ({ icon, title, desc }) => (
            <div className="feature-card">
                <div className="icon-box">
                    <i data-lucide={icon}></i>
                </div>
                <h3>{title}</h3>
                <p>{desc}</p>
            </div>
        );

        const Features = () => (
            <section id="features" className="container reveal">
                <div className="section-header">
                    <h2>{window.t('features_title')}</h2>
                    <p>Our platform is designed to make food donation simple, safe, and impactful for everyone involved.</p>
                </div>
                <div className="features-grid">
                    <FeatureCard icon="map-pin" title={window.t('feature_1_title')} desc="Connect with nearby NGOs and donors within minutes using our smart geo-location matching." />
                    <FeatureCard icon="shield-check" title={window.t('feature_2_title')} desc="Strict food safety guidelines and certified volunteers for secure pickup and delivery." />
                    <FeatureCard icon="clock" title={window.t('feature_3_title')} desc="Track your donation from the moment it's posted until it reaches those in need." />
                    <FeatureCard icon="bar-chart-3" title={window.t('feature_4_title')} desc="Get detailed reports on how many meals you've provided and your environmental contribution." />
                </div>
            </section>
        );

        const Step = ({ num, icon, title, desc }) => (
            <div className="step">
                <div className="step-number">{num}</div>
                <i data-lucide={icon} style={{ width: '48px', height: '48px', color: 'var(--primary)', marginBottom: '1.5rem' }}></i>
                <h3>{title}</h3>
                <p>{desc}</p>
            </div>
        );

        const HowItWorks = () => (
            <section id="how-it-works" style={{ backgroundColor: 'rgba(var(--primary-rgb), 0.03)', borderTop: '1px solid var(--border)', borderBottom: '1px solid var(--border)' }}>
                <div className="container reveal">
                    <div className="section-header">
                        <h2>{window.t('how_title')}</h2>
                        <p>Donating and receiving food has never been this straightforward.</p>
                    </div>
                    <div className="steps-grid">
                        <Step num="1" icon="plus-circle" title={window.t('step_1_title')} desc="Post your surplus food details, quantity, and expiration time on our platform." />
                        <Step num="2" icon="users" title={window.t('step_2_title')} desc="NGOs near your location get notified and accept the donation request instantly." />
                        <Step num="3" icon="truck" title={window.t('step_3_title')} desc="Coordinated logistics ensure the food is picked up and delivered safely to its destination." />
                    </div>
                </div>
            </section>
        );

        const StatItem = ({ target, label }) => {
            const [count, setCount] = useState(0);
            const ref = useRef();

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    if (entries[0].isIntersecting) {
                        let start = 0;
                        const duration = 2000;
                        const increment = target / (duration / 16);

                        const timer = setInterval(() => {
                            start += increment;
                            if (start >= target) {
                                setCount(target);
                                clearInterval(timer);
                            } else {
                                setCount(Math.ceil(start));
                            }
                        }, 16);
                        observer.unobserve(ref.current);
                    }
                }, { threshold: 0.5 });

                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [target]);

            return (
                <div className="stat-item reveal" ref={ref}>
                    <h3>{count.toLocaleString()}</h3>
                    <p>{label}</p>
                </div>
            );
        };

        const ImpactStats = () => (
            <section id="impact" className="stats">
                <div className="container">
                    <div className="stats-grid">
                        <StatItem target={50000} label={window.t('stat_meals')} />
                        <StatItem target={12000} label={window.t('stat_people')} />
                        <StatItem target={450} label={window.t('stat_donors')} />
                        <StatItem target={120} label={window.t('stat_ngos')} />
                    </div>
                </div>
            </section>
        );

        const CTASection = () => (
            <section className="container reveal">
                <div style={{ background: 'var(--surface)', borderRadius: '32px', padding: '60px', textAlign: 'center', boxShadow: 'var(--shadow-md)' }}>
                    <h2 style={{ color: 'var(--text-main)' }}>Start Making an Impact Today</h2>
                    <p style={{ marginBottom: '2rem', color: 'var(--text-muted)' }}>Join our community of donors and volunteers committed to ending food waste.</p>
                    <div className="hero-btns">
                        <a href="signup.html" className="btn btn-primary">Join as Donor</a>
                        <a href="signup.html" className="btn btn-outline">Become an NGO Partner</a>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer>
                <div className="container">
                    <div className="footer-grid">
                        <div className="footer-links">
                            <a href="react-version.html" className="logo footer-logo">
                                <i data-lucide="heart"></i>
                                FoodBridge
                            </a>
                            <p style={{ color: '#94a3b8', maxWidth: '300px' }}>{window.t('footer_tagline')}</p>
                        </div>
                        <div className="footer-links">
                            <h4>Platform</h4>
                            <ul>
                                <li><a href="#">How it works</a></li>
                                <li><a href="login.html">Donate Food</a></li>
                                <li><a href="#">Partner NGOs</a></li>
                                <li><a href="#">Safety Guidelines</a></li>
                            </ul>
                        </div>
                        <div className="footer-links">
                            <h4>Company</h4>
                            <ul>
                                <li><a href="#">About Us</a></li>
                                <li><a href="#">Contact</a></li>
                                <li><a href="#">Privacy Policy</a></li>
                                <li><a href="#">Careers</a></li>
                            </ul>
                        </div>
                        <div className="footer-links">
                            <h4>Social</h4>
                            <div style={{ display: 'flex', gap: '1rem' }}>
                                <a href="#"><i data-lucide="twitter"></i></a>
                                <a href="#"><i data-lucide="instagram"></i></a>
                                <a href="#"><i data-lucide="facebook"></i></a>
                                <a href="#"><i data-lucide="linkedin"></i></a>
                            </div>
                        </div>
                    </div>
                    <div className="footer-bottom">
                        <p>&copy; 2026 FoodBridge App. All Rights Reserved.</p>
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            const [scrolled, setScrolled] = useState(false);
            const [darkMode, setDarkMode] = useState(false);
            const [showLangModal, setShowLangModal] = useState(!localStorage.getItem('fb_language'));

            useReveal();

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark-mode');
                } else {
                    document.documentElement.classList.remove('dark-mode');
                }
            }, [darkMode]);

            useEffect(() => {
                lucide.createIcons();
            }); // Re-run after any render to catch new icons

            // Food Expiry Alert Feature
            useEffect(() => {
                fetch('http://localhost:5000/api/donations/expiring')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.length > 0) {
                            data.forEach(item => {
                                alert('⚠️ Warning: ' + item.foodName + ' expiring soon!');
                            });
                        }
                    })
                    .catch(err => console.error("Error fetching expiring donations:", err));
            }, []);

            if (showLangModal) {
                return (
                    <div style={{ position: 'fixed', top: 0, left: 0, width: '100%', height: '100vh', background: 'rgba(0,0,0,0.6)', backdropFilter: 'blur(8px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 9999 }}>
                        <div style={{ background: 'var(--surface)', padding: '2.5rem', borderRadius: '24px', textAlign: 'center', maxWidth: '400px', width: '90%', boxShadow: 'var(--shadow-lg)' }}>
                            <div style={{ width: '64px', height: '64px', borderRadius: '50%', background: 'rgba(16, 185, 129, 0.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 1.5rem', color: 'var(--primary)' }}>
                                <i data-lucide="globe" style={{ width: '32px', height: '32px' }}></i>
                            </div>
                            <h2 style={{ marginBottom: '0.5rem', fontSize: '1.5rem', color: 'var(--text-main)' }}>Choose Language</h2>
                            <h2 style={{ marginBottom: '2rem', fontSize: '1.5rem', fontFamily: 'var(--font-hindi)', color: 'var(--text-muted)' }}>अपनी भाषा चुनें</h2>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                                <button className="btn btn-outline" style={{ display: 'flex', justifyContent: 'space-between', padding: '1rem' }} onClick={() => { window.setLang('english'); setShowLangModal(false); window.location.reload(); }}>
                                    <span style={{ fontSize: '1.1rem' }}>🇬🇧 English</span> <span>Continue →</span>
                                </button>
                                <button className="btn btn-outline" style={{ display: 'flex', justifyContent: 'space-between', padding: '1rem', fontFamily: 'var(--font-hindi)' }} onClick={() => { window.setLang('hindi'); setShowLangModal(false); window.location.reload(); }}>
                                    <span style={{ fontSize: '1.1rem' }}>🇮🇳 हिंदी</span> <span>जारी रखें →</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-wrapper">
                    <Navbar scrolled={scrolled} />
                    <Hero />
                    <Features />
                    <HowItWorks />
                    <ImpactStats />
                    <CTASection />
                    <Footer />

                    <button className="theme-toggle" onClick={() => setDarkMode(!darkMode)} title="Toggle Dark/Light Mode">
                        <i data-lucide={darkMode ? "sun" : "moon"}></i>
                    </button>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
