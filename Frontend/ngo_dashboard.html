<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodBridge | NGO Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Translations & Global Functions -->
    <script src="lang.js"></script>
    <script src="utils.js"></script>
    <script src="firebaseService.js"></script>
    <script type="text/babel" src="shared_components.jsx"></script>

    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        :root {
            --primary: #22c55e;
            --primary-rgb: 34, 197, 94;
            --primary-dark: #16a34a;
            --background: #f8fafc;
            --surface: rgba(255, 255, 255, 0.7);
            --surface-solid: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: rgba(226, 232, 240, 0.8);
            --glass-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            
            --status-pending: #d97706;
            --status-pending-bg: #fef3c7;
            --status-accepted: #2563eb;
            --status-accepted-bg: #dbeafe;
            --status-completed: #16a34a;
            --status-completed-bg: #dcfce7;
            --status-cancelled: #dc2626;
            --status-cancelled-bg: #fee2e2;
        }

        [data-theme="dark"] {
            --background: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-solid: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(51, 65, 85, 0.8);
            --glass-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);

            --status-pending: #fcd34d;
            --status-pending-bg: rgba(245, 158, 11, 0.2);
            --status-accepted: #60a5fa;
            --status-accepted-bg: rgba(59, 130, 246, 0.2);
            --status-completed: #4ade80;
            --status-completed-bg: rgba(34, 197, 94, 0.2);
            --status-cancelled: #f87171;
            --status-cancelled-bg: rgba(239, 68, 68, 0.2);
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }

        * { box-sizing: border-box; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeInRow { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .fade-in { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
        .scale-up { animation: scaleUp 0.3s ease-out forwards; }
        .fade-in-row { animation: fadeInRow 0.5s ease-out forwards; opacity: 0; }
        tbody tr:nth-child(1) { animation-delay: 0.05s; }
        tbody tr:nth-child(2) { animation-delay: 0.1s; }
        tbody tr:nth-child(3) { animation-delay: 0.15s; }
        tbody tr:nth-child(4) { animation-delay: 0.2s; }
        
        .donation-card:nth-child(1) { animation-delay: 0.05s; }
        .donation-card:nth-child(2) { animation-delay: 0.1s; }
        .donation-card:nth-child(3) { animation-delay: 0.15s; }
        .donation-card:nth-child(4) { animation-delay: 0.2s; }
        .donation-card:nth-child(5) { animation-delay: 0.25s; }

        /* Layout Structure */
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid var(--border);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 50;
        }
        .sidebar.collapsed { width: 80px; }

        .sidebar-header {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            overflow: hidden;
        }
        .sidebar-header h2 { margin-left: 12px; color: var(--primary); font-size: 20px; margin-top: 0; margin-bottom: 0; }

        .nav-items {
            padding: 24px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            border-radius: 16px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
        }
        .nav-item:hover { background: rgba(34, 197, 94, 0.1); color: var(--primary); }
        .nav-item.active { background: var(--primary); color: white; }

        .collapse-btn {
            position: absolute;
            right: -14px;
            top: 21px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .navbar {
            height: 70px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            z-index: 40;
        }

        .navbar-left { display: none; align-items: center; }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 8px 16px;
            width: 300px;
        }
        .search-bar input {
            border: none; background: transparent; outline: none; margin-left: 8px; color: var(--text-main); width: 100%; font-family: 'Outfit';
        }

        .nav-right { display: flex; align-items: center; gap: 24px; }
        .notification-bell { position: relative; cursor: pointer; color: var(--text-muted); }
        .badge-red {
            position: absolute; top: -4px; right: -4px;
            background: #ef4444; color: white;
            font-size: 10px; width: 16px; height: 16px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: bold;
        }

        .user-profile { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .user-profile img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }

        .main-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
        }

        /* General Card */
        .card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--glass-shadow);
        }

        .welcome-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }
        .stat-card {
            display: flex; align-items: center; gap: 16px;
            padding: 24px; border-radius: 24px;
            background: var(--surface); border: 1px solid var(--border);
            box-shadow: var(--glass-shadow);
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-4px); }
        .stat-icon {
            width: 56px; height: 56px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
        }
        .stat-info h3 { margin: 0 0 4px 0; font-size: 28px; }
        .stat-info p { margin: 0; color: var(--text-muted); font-size: 14px; }
        .stat-info .subtext { font-size: 12px; font-weight: 500; margin-top: 4px; display: inline-block; opacity: 0.8; }

        /* Available Donations Grid */
        .filter-tabs { display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; overflow-x: auto; }
        .tab-btn {
            background: transparent; border: none; padding: 8px 16px; font-size: 15px; font-weight: 500;
            color: var(--text-muted); cursor: pointer; border-radius: 99px; transition: all 0.2s; font-family: 'Outfit';
            white-space: nowrap;
        }
        .tab-btn:hover { background: rgba(34, 197, 94, 0.05); color: var(--primary); }
        .tab-btn.active { background: var(--primary); color: white; }

        .donation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .donation-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--glass-shadow);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .donation-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .donation-card.accepted {
            background: rgba(34, 197, 94, 0.05);
            border-color: var(--primary);
        }
        .donation-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .donation-card-title { font-size: 18px; font-weight: 600; margin: 0 0 4px 0; }
        .donation-qty { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .donation-meta { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text-muted); margin-bottom: 12px; flex: 1; }
        .donation-meta-item { display: flex; align-items: center; gap: 6px; }
        .distance-text { color: var(--primary); font-weight: 500; }
        
        .expiry-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; align-self: flex-start; }
        .expiry-red { background: #fee2e2; color: #dc2626; }
        .expiry-yellow { background: #fef3c7; color: #d97706; }
        .expiry-green { background: #dcfce7; color: #16a34a; }
        [data-theme="dark"] .expiry-red { background: rgba(239,68,68,0.2); color: #f87171; }
        [data-theme="dark"] .expiry-yellow { background: rgba(245,158,11,0.2); color: #fcd34d; }
        [data-theme="dark"] .expiry-green { background: rgba(34,197,94,0.2); color: #4ade80; }

        .donation-actions { display: flex; gap: 10px; margin-top: 16px; }
        .btn-accept { flex: 1; background: var(--primary); color: white; border: none; padding: 10px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: 'Outfit'; }
        .btn-accept:hover { background: var(--primary-dark); transform: scale(1.02); }
        .btn-decline { flex: 1; background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 10px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: 'Outfit'; }
        .btn-decline:hover { background: #fee2e2; }
        [data-theme="dark"] .btn-decline:hover { background: rgba(239,68,68,0.1); }

        .category-badge { background: var(--background); color: var(--text-main); border: 1px solid var(--border); padding: 4px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; }

        /* Main Grid Layout */
        .dashboard-grid-main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        /* Table Section */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-weight: 500; font-size: 14px; }
        tbody tr { transition: background 0.2s; }
        tbody tr:hover { background: rgba(34, 197, 94, 0.03); }
        
        .badge { display: inline-block; padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; }
        .status-Scheduled { background: var(--status-accepted-bg); color: var(--status-accepted); }
        .status-InTransit { background: var(--status-pending-bg); color: var(--status-pending); }
        .status-Delivered { background: var(--status-completed-bg); color: var(--status-completed); }

        .btn-assign { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 6px 12px; border-radius: 99px; font-weight: 600; font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: 'Outfit'; }
        .btn-assign:hover { background: var(--primary); color: white; }

        /* Timeline */
        .schedule-timeline { display: flex; flex-direction: column; gap: 20px; position: relative; padding-left: 20px; margin-top: 16px; }
        .schedule-timeline::before { content: ''; position: absolute; left: 25px; top: 10px; bottom: 10px; width: 2px; background: var(--border); z-index: 1; }
        .schedule-item { display: flex; gap: 16px; position: relative; z-index: 2; align-items: flex-start; }
        .schedule-time { width: 65px; font-weight: 600; color: var(--primary); font-size: 13px; text-align: right; padding-top: 2px; flex-shrink: 0; }
        .schedule-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--surface-solid); border: 2px solid var(--primary); margin-top: 4px; box-shadow: 0 0 0 4px var(--surface); flex-shrink: 0; }
        .schedule-content { background: var(--background); padding: 16px; border-radius: 16px; border: 1px solid var(--border); flex: 1; }
        .schedule-content h4 { margin: 0 0 4px 0; font-size: 15px; }
        .schedule-content p { margin: 0; color: var(--text-muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }

        /* Quick Actions */
        .quick-actions-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 16px; }
        .action-btn { background: var(--background); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-main); font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: 'Outfit'; font-size: 13px; }
        .action-btn:hover { background: rgba(34,197,94,0.05); border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; z-index: 200;
        }
        .modal-content {
            background: var(--surface-solid); border-radius: 24px;
            width: 90%; max-width: 450px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.2);
        }
        .modal-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--surface-solid); z-index: 10; }
        .modal-header h2 { margin: 0; font-size: 20px; }
        .modal-body { padding: 24px; }
        .btn-icon { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 6px; border-radius: 8px; transition: all 0.2s; }
        .btn-icon:hover { background: rgba(34, 197, 94, 0.1); color: var(--primary); }

        .volunteer-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .volunteer-option { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: all 0.2s; }
        .volunteer-option:hover:not(.disabled) { border-color: var(--primary); background: rgba(34,197,94,0.05); }
        .volunteer-option.selected { border-color: var(--primary); background: rgba(34,197,94,0.1); }
        .volunteer-option.disabled { opacity: 0.6; cursor: not-allowed; background: var(--background); }
        .avatar-small { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }

        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 10px 20px; border-radius: 99px; font-weight: 600; cursor: pointer; font-family: 'Outfit'; }
        .btn-outline:hover { background: var(--background); }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 99px; font-weight: 600; cursor: pointer; font-family: 'Outfit'; transition: opacity 0.2s; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        /* SOS Emergency Feature CSS */
        :root {
            --sos-red: #ef4444;
            --sos-dark: #dc2626;
            --sos-light: rgba(239, 68, 68, 0.05);
        }
        @keyframes flashBanner {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        @keyframes sosGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.2); }
            50% { box-shadow: 0 0 20px 5px rgba(239,68,68,0.5); }
        }
        @keyframes urgentShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        @keyframes confettiFall {
            0% { transform: translateY(-100%) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
        @keyframes slideOutRight {
            0% { transform: translateX(0); opacity: 1; height: auto; }
            100% { transform: translateX(100%); opacity: 0; height: 0; padding: 0; margin: 0; border: none; }
        }
        @keyframes bounceCheck {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        .sos-banner {
            background: linear-gradient(90deg, var(--sos-dark), var(--sos-red));
            color: white;
            padding: 12px 24px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            animation: flashBanner 2s infinite;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        .sos-pulse-dot {
            width: 12px; height: 12px; border-radius: 50%; background: white;
            box-shadow: 0 0 0 0 rgba(255,255,255,0.7);
            animation: pulse-white 1.5s infinite;
        }
        @keyframes pulse-white {
            0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255,255,255,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        }
        .sos-card {
            background: var(--sos-light);
            border-left: 4px solid var(--sos-red);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            animation: sosGlow 2s infinite;
            transition: all 0.3s;
            margin-bottom: 16px;
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .sos-card.urgent { animation: sosGlow 1s infinite, urgentShake 0.5s infinite; }
        .sos-card.dismissing { animation: slideOutRight 0.5s forwards; overflow: hidden; }
        
        .timer-badge {
            background: var(--surface-solid);
            padding: 4px 12px; border-radius: 99px;
            font-weight: 600; font-size: 14px;
            display: inline-flex; align-items: center; gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .timer-badge.red { color: var(--sos-red); animation: pulse-white 1s infinite; }
        .timer-badge.orange { color: #f97316; }
        .timer-badge.green { color: var(--primary); }

        .sos-history-table {
            width: 100%; border-collapse: collapse; min-width: 600px;
        }
        .confetti {
            position: fixed; top: -10px; width: 10px; height: 10px; z-index: 9999;
            animation: confettiFall linear forwards;
        }

        /* NGO SOS Sending CSS */
        :root {
            --ngo-sos-orange: #f97316;
            --ngo-sos-orange-dark: #ea580c;
            --ngo-sos-light: rgba(249, 115, 22, 0.05);
        }
        @keyframes pulse-orange {
            0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); }
            100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
        }
        @keyframes radio-waves {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }
        .ngo-sos-card {
            background: linear-gradient(135deg, var(--ngo-sos-orange), var(--ngo-sos-orange-dark));
            color: white; border-radius: 16px; padding: 24px;
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
            position: relative; overflow: hidden;
        }
        .ngo-sos-banner {
            background: var(--ngo-sos-orange); color: white;
            padding: 12px 24px; border-radius: 16px;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }
        .radio-wave {
            position: absolute; width: 100px; height: 100px; border: 2px solid var(--ngo-sos-orange);
            border-radius: 50%; top: 50%; left: 50%; margin-top: -50px; margin-left: -50px;
            animation: radio-waves 2s infinite linear;
        }
        .radio-wave:nth-child(2) { animation-delay: 0.6s; }
        .radio-wave:nth-child(3) { animation-delay: 1.2s; }
        
        .donor-response-card {
            background: var(--background); border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; text-align: left;

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const StatCard = ({ stat }) => {
            const [count, setCount] = useState(0);
            const target = stat.value;
            
            useEffect(() => {
                let start = 0;
                const duration = 1500;
                const increment = target / (duration / 16);
                const timer = setInterval(() => {
                    start += increment;
                    if (start >= target) {
                        setCount(target);
                        clearInterval(timer);
                    } else {
                        setCount(Math.ceil(start));
                    }
                }, 16);
                return () => clearInterval(timer);
            }, [target]);

            return (
                <div className="stat-card fade-in">
                    <div className="stat-icon" style={{ backgroundColor: `${stat.color}20`, color: stat.color }}>
                        <Icon name={stat.icon} size={28} />
                    </div>
                    <div className="stat-info">
                        <h3>{count.toLocaleString()}</h3>
                        <p>{window.t(stat.labelKey)}</p>
                        <span className="subtext" style={{ color: stat.color }}>{stat.subtext}</span>
                    </div>
                </div>
            );
        };

        const DonationCard = ({ donation, onAccept, onDecline }) => {

            const handleAcceptClick = () => {
                setStatus('accepting');
                setTimeout(() => {
                    setStatus('accepted');
                    setTimeout(() => {
                        onAccept(donation);
                    }, 800);
                }, 500);
            };

            if (status === 'declined') return null;

            return (
                <div className={`donation-card fade-in ${status === 'accepted' || status === 'accepting' ? 'accepted' : ''}`}>
                    <div className="donation-card-header">
                        <div>
                            <h3 className="donation-card-title">{donation.name}</h3>
                            <span className="category-badge">{donation.category}</span>
                        </div>
                        <span className="donation-qty">{donation.quantity}</span>
                    </div>
                    
                    <div className="donation-meta">
                        <div className="donation-meta-item">
                            <Icon name="user" size={14} /> {donation.donor}
                        </div>
                        <div className="donation-meta-item">
                            <Icon name="map-pin" size={14} color="var(--primary)" /> 
                            <span className="distance-text">{donation.distance}</span>
                        </div>
                        <div className="donation-meta-item">
                            <Icon name="clock" size={14} /> Posted {donation.posted}

                    <div className={`expiry-badge expiry-${donation.expiryLevel}`}>
                        {donation.expiryLevel === 'red' && "⚠️ "}

                                <button className="btn-decline" onClick={() => setStatus('declined')}>
                                    Decline

                            <button className="btn-accept" style={{ width: '100%', cursor: 'default' }}>
                                Accepted <Icon name="check-circle-2" size={16} />
                            </button>
                        )}
                    </div>
                </div>
            );
        };

                { id: 'sos2', level: 'HIGH', timeAgo: '12 min ago', donor: 'Priya Sharma', distance: '2.8 km — Lajpat Nagar', foodType: 'Raw Vegetables', quantity: '30 kg mix sabzi', expiryTimestamp: Date.now() + 2 * 60 * 60 * 1000, notes: 'Market se extra le aaya' }

            const [activeNgoSos, setActiveNgoSos] = useState(false);
            const [sendingProgressText, setSendingProgressText] = useState('Alert bheja ja raha hai...');
            const [incomingDonors, setIncomingDonors] = useState([]);

                { date: '15 Jan', type: 'Orphanage', people: '80 people', donors: '2 donors', respTime: '22 min', status: 'Resolved ✅' },

            // NGO SOS Logic
            const handleSendNgoSos = () => {

            const handleConfirmNgoSos = () => {

                setIncomingDonors([
                    { id: 1, donor: 'Raj Restaurant', food: '150 plates dal chawal', eta: '8 minutes remaining', progress: 80, status: 'On the way 🚗', volunteer: 'Amit Kumar', phone: '98765XXXXX' },

                        iconSize: [24, 24], iconAnchor: [12, 12]
                    });
                    L.marker(ngoLoc, {icon: ngoIcon}).addTo(map).bindPopup("<b>NGO Location</b>");

                    const donorIcon = L.divIcon({
                        className: 'custom-div-icon',

                                 <div style="position:absolute; top:-8px; left:-8px; width:40px; height:40px; border-radius:50%; background-color:rgba(34,197,94,0.4); animation:pulseRing 2s infinite; z-index:1;"></div>

                    L.polyline([donorLoc, ngoLoc], {color: '#f97316', dashArray: '5, 10'}).addTo(map);
                    map.fitBounds(L.latLngBounds(donorLoc, ngoLoc), { padding: [50, 50] });
                }
            }, [trackModalOpen, locStatus]);
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(Date.now()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Food Expiry Alert Feature
            useEffect(() => {
                fetch('http://localhost:5000/api/donations/expiring')

            useEffect(() => {

            const navItems = [

                { id: "Schedule", nameKey: "ngo_nav_schedule", icon: "calendar", href: "ngo_schedule.html" },

            const todayStr = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            const filteredAvailable = availableDonations.filter(d => {
                if (filter === 'All') return true;

                if (filter === 'Expiring Soon') return d.expiryLevel === 'red';
                return d.category.includes(filter);
            });

            // SOS Logic
            const getTimerDetails = (expiry) => {
                const diff = expiry - currentTime;
                if (diff <= 0) return { text: "Expired", class: "red", shake: false };
                
                const m = Math.floor(diff / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                const text = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                
                let cls = "green";
                let shake = false;
                if (m < 10) { cls = "red"; shake = true; }

                                                    <span style={{ fontSize: '12px', background: 'var(--status-accepted-bg)', color: 'var(--status-accepted)', padding: '2px 8px', borderRadius: '99px' }}>Coming ✅</span>
                                                </div>
                                                <div style={{ fontSize: '13px', color: 'var(--text-muted)', marginBottom: '8px' }}>150 plates dal chawal (0.8 km)</div>
                                                <div style={{ fontSize: '13px', fontStyle: 'italic', marginBottom: '12px' }}>"Abhi bhej rahe hain!" (ETA: 10m)</div>
                                                <button className="btn-outline" style={{ width: '100%', padding: '6px', fontSize: '13px', display: 'flex', justifyContent: 'center', gap: '4px' }}><Icon name="phone" size={14}/> Contact</button>
                                            </div>

                                            <div className="donor-response-card" style={{ borderLeft: '4px solid #eab308' }}>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                                                    <span style={{ fontWeight: 600 }}>Priya Sharma</span>
                                                    <span style={{ fontSize: '12px', background: '#fef3c7', color: '#d97706', padding: '2px 8px', borderRadius: '99px' }}>Interested 🟡</span>
                                                </div>
                                                <div style={{ fontSize: '13px', color: 'var(--text-muted)', marginBottom: '8px' }}>20 kg vegetables (1.5 km)</div>
                                                <div style={{ fontSize: '13px', fontStyle: 'italic', marginBottom: '12px' }}>"Available hoon" (ETA: 20m)</div>
                                                <button className="btn-outline" style={{ width: '100%', padding: '6px', fontSize: '13px', display: 'flex', justifyContent: 'center', gap: '4px' }}><Icon name="phone" size={14}/> Contact</button>
                                            </div>

                                            <div className="donor-response-card" style={{ borderLeft: '4px solid #eab308' }}>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                                                    <span style={{ fontWeight: 600 }}>Hotel Crown Plaza</span>
                                                    <span style={{ fontSize: '12px', background: '#fef3c7', color: '#d97706', padding: '2px 8px', borderRadius: '99px' }}>Interested 🟡</span>
                                                </div>
                                                <div style={{ fontSize: '13px', color: 'var(--text-muted)', marginBottom: '8px' }}>200 plates mixed (2.1 km)</div>
                                                <div style={{ fontSize: '13px', fontStyle: 'italic', marginBottom: '12px' }}>"Pickup ke liye ready"</div>
                                                <button className="btn-outline" style={{ width: '100%', padding: '6px', fontSize: '13px', display: 'flex', justifyContent: 'center', gap: '4px' }}><Icon name="phone" size={14}/> Contact</button>
                                            </div>

                                            <div className="donor-response-card" style={{ borderLeft: '4px solid var(--text-muted)' }}>
                                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px' }}>
                                                    <span style={{ fontWeight: 600 }}>Rohan Gupta</span>
                                                    <span style={{ fontSize: '12px', background: 'var(--border)', color: 'var(--text-main)', padding: '2px 8px', borderRadius: '99px' }}>Standby ⏳</span>
                                                </div>
                                                <div style={{ fontSize: '13px', color: 'var(--text-muted)', marginBottom: '8px' }}>50 meal boxes (3.2 km)</div>
                                                <div style={{ fontSize: '13px', fontStyle: 'italic', marginBottom: '12px' }}>"De sakte hain"</div>
                                                <button className="btn-outline" style={{ width: '100%', padding: '6px', fontSize: '13px', display: 'flex', justifyContent: 'center', gap: '4px' }}><Icon name="phone" size={14}/> Contact</button>
                                            </div>
                                        </div>

                                        <div style={{ background: 'var(--background)', padding: '16px', borderRadius: '12px', marginBottom: '24px' }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px', fontWeight: 600 }}>
                                                <span>Total food coming: ~420 plates</span>
                                                <span style={{ color: 'var(--primary)' }}>~350 people</span>
                                            </div>
                                            <div style={{ height: '8px', background: 'var(--border)', borderRadius: '99px', overflow: 'hidden' }}>
                                                <div style={{ height: '100%', background: 'var(--primary)', width: '85%' }}></div>
                                            </div>
                                        </div>

                                        <div style={{ display: 'flex', gap: '12px' }}>
                                            <button className="btn-outline" style={{ flex: 1, color: 'var(--sos-red)', borderColor: 'var(--sos-red)' }} onClick={() => setNgoSosModal({ open: false, step: 1, formData: {} })}>❌ Cancel Request</button>
                                            <button className="btn-primary" style={{ flex: 2 }} onClick={handleConfirmNgoSos}>✅ Great! Close</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Track Donor Modal */}
                    {trackModalOpen && (
                        <div className="modal-overlay" style={{ zIndex: 3000, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <div className="modal-content scale-up" style={{ width: '90%', maxWidth: '800px', padding: 0, overflow: 'hidden' }}>
                                <div style={{ padding: '20px 24px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'var(--surface)' }}>
                                    <div>
                                        <h2 style={{ margin: '0 0 4px 0', display: 'flex', alignItems: 'center', gap: '8px' }}>
                                            <Icon name="map-pin" color="var(--primary)" /> 
                                            Live Tracking: {trackedDonation?.donor}
                                        </h2>
                                        <div style={{ fontSize: '14px', color: 'var(--text-muted)' }}>{trackedDonation?.food}</div>
                                    </div>
                                    <button className="btn-icon" onClick={closeTrackModal}>
                                        <Icon name="x" size={24} />
                                    </button>
                                </div>
                                
                                <div style={{ padding: '16px 24px', background: 'var(--background)', display: 'flex', gap: '16px', alignItems: 'center', borderBottom: '1px solid var(--border)' }}>
                                    <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '12px' }}>
                                        {locStatus === 'ON' && <span style={{ width: '12px', height: '12px', borderRadius: '50%', background: 'var(--primary)', boxShadow: '0 0 10px var(--primary)', animation: 'pulse 2s infinite' }}></span>}
                                        {locStatus === 'DETECTING' && <span className="animate-spin" style={{ display: 'inline-block', width: '14px', height: '14px', border: '2px solid #f59e0b', borderTopColor: 'transparent', borderRadius: '50%' }}></span>}
                                        <div>
                                            <div style={{ fontWeight: 600 }}>{locStatus === 'ON' ? 'Live Location Active' : 'Connecting to Donor...'}</div>
                                            <div style={{ fontSize: '13px', color: 'var(--text-muted)' }}>Updates every 5 seconds</div>
                                        </div>
                                    </div>
                                    {locStatus === 'ON' && (
                                        <div style={{ display: 'flex', gap: '8px' }}>
                                            <button className="btn-outline" style={{ padding: '8px 12px', fontSize: '13px', display: 'flex', alignItems: 'center', gap: '6px' }} onClick={() => { if(mapInstanceRef.current) mapInstanceRef.current.setView(donorLoc, 15); }}>
                                                <Icon name="crosshair" size={14} /> Center
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div style={{ position: 'relative', height: '500px', width: '100%', background: '#e2e8f0' }}>
                                    <div ref={mapRef} style={{ width: '100%', height: '100%' }}></div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
