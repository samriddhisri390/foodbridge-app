<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FoodBridge</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Translations & Global Functions -->
    <script src="lang.js"></script>
    
    <!-- Pre-existing Styles -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('login-bg.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .theme-toggle {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            border: none;
            z-index: 1000;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 3rem;
            width: 100%;
            max-width: 480px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            text-align: center;
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-control {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 3rem;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--surface);
            color: var(--text-main);
            transition: var(--transition);
            font-size: 1rem;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--surface);
            color: var(--text-main);
        }

        .social-btn:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header h1 {
            font-size: 2.25rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .login-header p {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        .role-selector {
            display: flex;
            background: rgba(var(--primary-rgb), 0.05);
            padding: 0.5rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            position: relative;
        }

        .role-option {
            flex: 1;
            padding: 0.75rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            z-index: 1;
            transition: var(--transition);
            color: var(--text-muted);
        }

        .role-option.active {
            color: white;
            background: var(--primary);
            box-shadow: var(--shadow-md);
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-main);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            color: var(--text-muted);
            width: 1.25rem;
            height: 1.25rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.1);
        }

        .form-utils {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .social-login {
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .social-btns {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.25rem;
        }

        .feedback {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            display: none;
        }

        .feedback.error { background: #fee2e2; color: #b91c1c; display: block; }
        .feedback.success { background: #d1fae5; color: #065f46; display: block; }


        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }
            .login-card {
                padding: 2.5rem 1.5rem;
                border-radius: 20px;
                max-width: 100%;
            }
            .login-header h1 {
                font-size: 1.75rem;
            }
            .role-option {
                font-size: 0.85rem;
                padding: 0.5rem;
            }
            .form-utils {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const LanguageSwitcher = () => {
            const [lang, setLang] = useState(window.getLang());
            const toggleLang = (newLang) => {
                window.setLang(newLang);
                setLang(newLang);
                window.location.reload();
            };
            return (
                <div className="lang-switcher" style={{ position: 'fixed', top: '2rem', right: '2rem', zIndex: 1000, background: 'var(--surface)', boxShadow: 'var(--shadow-md)' }}>
                    <button className={lang === 'english' ? 'active' : ''} onClick={() => toggleLang('english')}>🇬🇧 EN</button>
                    <button className={lang === 'hindi' ? 'active' : ''} onClick={() => toggleLang('hindi')}>🇮🇳 HI</button>
                </div>
            );
        };

        const App = () => {
            const [role, setRole] = useState('donor');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            const [loading, setLoading] = useState(false);
            const [darkMode, setDarkMode] = useState(false);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark-mode');
                } else {
                    document.documentElement.classList.remove('dark-mode');
                }
            }, [darkMode]);

            useEffect(() => {
                lucide.createIcons();
            }, [role, error, success, darkMode]);

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                setSuccess('');

                if (!email || !password) {
                    setError('Please fill in all fields.');
                    return;
                }

                if (!email.includes('@')) {
                    setError('Please enter a valid email address.');
                    return;
                }

                setLoading(true);
                // Mock role-based login logic
                setTimeout(() => {
                    setLoading(false);
                    
                    if (role === 'admin') {
                        if (email === 'admin@foodbridge.com' && password === 'Admin@2026') {
                            setSuccess('Welcome Admin! Redirecting to Admin Panel...');
                            setTimeout(() => window.location.href = 'admin_panel.html', 1000);
                        } else {
                            setError('Admin access denied!');
                        }
                    } else if (role === 'donor') {
                        if (email === 'donor@foodbridge.com' && password === 'password123') {
                            setSuccess('Welcome Donor! Redirecting to Donor Dashboard...');
                            setTimeout(() => window.location.href = 'donor_dashboard.html', 1000);
                        } else {
                            setError('Invalid donor credentials');
                        }
                    } else if (role === 'ngo') {
                        if (email === 'ngo@foodbridge.com' && password === 'password123') {
                            setSuccess('Welcome NGO! Redirecting to NGO Dashboard...');
                            setTimeout(() => window.location.href = 'ngo_dashboard.html', 1000);
                        } else {
                            setError('Invalid NGO credentials');
                        }
                    }
                }, 1000);
            };

            return (
                <>
                <LanguageSwitcher />
                <div className="login-card">
                    <div className="login-header">
                        <h1>{window.t('login_title')}</h1>
                        <p>{window.t('login_subtitle')}</p>
                    </div>

                    <div className="role-selector">
                        <div 
                            className={`role-option ${role === 'donor' ? 'active' : ''}`}
                            onClick={() => setRole('donor')}
                        >
                            {window.t('login_role_donor')}
                        </div>
                        <div 
                            className={`role-option ${role === 'ngo' ? 'active' : ''}`}
                            onClick={() => setRole('ngo')}
                        >
                            {window.t('login_role_ngo')}
                        </div>
                        <div 
                            className={`role-option ${role === 'admin' ? 'active' : ''}`}
                            onClick={() => setRole('admin')}
                        >
                            {window.t('login_role_admin')}
                        </div>
                    </div>

                    {error && <div className="feedback error">{error}</div>}
                    {success && <div className="feedback success">{success}</div>}

                    <form onSubmit={handleSubmit}>
                        <div className="form-group">
                            <label>{window.t('login_email')}</label>
                            <div className="input-wrapper">
                                <i data-lucide="mail"></i>
                                <input 
                                    type="email" 
                                    className="form-control" 
                                    placeholder="your@email.com"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                />
                            </div>
                        </div>

                        <div className="form-group">
                            <label>{window.t('login_password')}</label>
                            <div className="input-wrapper">
                                <i data-lucide="lock"></i>
                                <input 
                                    type="password" 
                                    className="form-control" 
                                    placeholder="••••••••"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                />
                            </div>
                        </div>

                        <div className="form-utils">
                            <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer' }}>
                                <input type="checkbox" style={{ accentColor: 'var(--primary)' }} /> {window.t('login_remember')}
                            </label>
                            <a href="forgot_password.html" className="forgot-link">{window.t('login_forgot')}</a>
                        </div>

                        <button type="submit" className="btn btn-primary" style={{ width: '100%', padding: '1rem' }} disabled={loading}>
                            {loading ? window.t('common_loading') : window.t('login_btn')}
                        </button>
                    </form>

                    <p style={{ marginTop: '2rem', fontSize: '0.875rem', color: 'var(--text-muted)' }}>
                        {window.t('login_no_account')} <a href="signup.html" style={{ color: 'var(--primary)', fontWeight: 600, textDecoration: 'none' }}>{window.t('login_signup')}</a>
                    </p>
                    <a href="react-version.html" style={{ display: 'block', marginTop: '1.5rem', fontSize: '0.875rem', color: 'var(--primary)', fontWeight: 600, textDecoration: 'none' }}>
                        <i data-lucide="arrow-left" style={{ width: '16px', height: '16px', verticalAlign: 'middle', marginRight: '0.5rem' }}></i>
                        {window.t('login_back_home')}
                    </a>

                    <div className="social-login">
                        <p style={{ fontSize: '0.75rem', fontWeight: 600, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>
                            {window.t('login_or')}
                        </p>
                        <div className="social-btns">
                            <div className="social-btn"><i data-lucide="github"></i></div>
                            <div className="social-btn"><i data-lucide="chrome"></i></div>
                            <div className="social-btn"><i data-lucide="facebook"></i></div>
                        </div>
                    </div>

                    <button className="theme-toggle" onClick={() => setDarkMode(!darkMode)} title="Toggle Dark/Light Mode">
                        <i data-lucide={darkMode ? "sun" : "moon"}></i>
                    </button>
                </div>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
